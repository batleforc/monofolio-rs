[tools]
"cargo:cargo-audit" = "latest"    # audit:rust, deps:cve:snapshot (RustSec advisories)
"cargo:cargo-deny" = "latest"     # deny: advisories, bans, licenses, sources (deny.toml)
"cargo:cargo-machete" = "latest"  # deps:unused (unused Rust dependencies)
"cargo:wasm-bindgen-cli" = "0.2.130"  # cargo leptos picks this from PATH: must equal wasm-bindgen in Cargo.lock
cocogitto = "latest"
copilot = "latest"
"github:batleforc/weebo-skillsagent" = "0.19.0"
gitleaks = "8.30.1"                # same version as .github/workflows/secret-scan.yaml
jq = "latest"                     # parses the audit JSON in deps:cve:snapshot
node = "lts"
opengrep = "latest"
perl = "latest"
pnpm = "latest"
semgrep = "latest"                # static analysis, same rulesets as semgrep.yaml
rust = { version = "latest", profile = "default", components = "rust-src,llvm-tools", targets = "wasm32-unknown-unknown,x86_64-unknown-linux-gnu" }
task = "latest"
trivy = "latest"                  # image CVE scanner (audit:image, image-scan.yaml)
uv = "latest"
yarn = "latest"
yq = "latest"

[env]
MISE_NODE_COREPACK = "true"

[hooks]
# Enabling corepack will install the `pnpm` package manager specified in your package.json
# alternatively, you can also install `pnpm` with mise
postinstall = 'npx corepack enable'

[settings]
# This must be enabled to make the hooks work
experimental = true
