[workspace]
resolver = "2"
members = ["libs/trace", "libs/content", "libs/api", "apps/frontend"]

[workspace.dependencies]
# Actix
actix-web = { version = "4", features = ["macros"] }
actix-files = { version = "0.6" }

# Async
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"

# Leptos
leptos = { version = "0.8" }
leptos_actix = { version = "0.8" }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8" }

# OpenAPI
utoipa = { version = "5", features = ["actix_extras"] }
utoipa-actix-web = { version = "0.1" }
utoipa-scalar = { version = "0.3", features = ["actix-web"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Tracing
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "registry",
    "std",
    "fmt",
] }
tracing-opentelemetry = { version = "0.32" }
tracing-actix-web = { version = "0.7" }

# OpenTelemetry
opentelemetry = { version = "0.31", features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.31", features = [
    "trace",
    "metrics",
    "rt-tokio",
] }
opentelemetry-otlp = { version = "0.31", features = [
    "grpc-tonic",
    "trace",
    "metrics",
] }

# Content parsing
pulldown-cmark = "0.12"
gray_matter = "0.2"

# Error handling
thiserror = "2"
tw_merge = { version = "0.1.21", features = ["variant"] }
icons = { version = "0.18.2", features = ["leptos"] }
leptos_ui = "0.3.22"

[profile.release]
lto = true
opt-level = 3

[profile.release.package.frontend]
opt-level = 'z'

[[workspace.metadata.leptos]]
# Name of the Leptos package inside the workspace
name = "frontend"

# Hydrate feature flag – compiled to WASM
lib-features = ["hydrate"]

# SSR feature flag – compiled to native
bin-features = ["ssr"]

# Output directory for generated artefacts
site-root = "target/site"

# Package directory under site-root for WASM / JS output
site-pkg-dir = "pkg"

# Directory with static assets copied into site-root
assets-dir = "apps/frontend/public"

# Address used by cargo-leptos dev server
site-addr = "0.0.0.0:3000"

# Address used by cargo-leptos for hot-reloading websocket
reload-port = 3001

# Main SCSS file
style-file = "apps/frontend/style/main.css"

# End2end testing command (can be overridden)
end2end-cmd = "echo 'no e2e runner configured'"

# Browser command (used by cargo-leptos to open the browser after build)
browser-query = "google-chrome-stable"
bin-package = "frontend"
lib-package = "frontend"

tailwind-input-file = "apps/frontend/style/main.css"
