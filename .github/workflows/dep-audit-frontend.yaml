# source: batlehub@20879e5 (.github/workflows/dep-audit-frontend.yaml), trimmed.
name: Frontend dependency audit
on:
  push:
    branches: ["main"]
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/dep-audit-frontend.yaml"
  pull_request:
    branches: ["main"]
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/dep-audit-frontend.yaml"
  # Daily so a CVE disclosed against an already-pinned dependency trips CI even
  # when nothing in the repo changed.
  schedule:
    - cron: "50 23 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Corepack is not used: Node stopped distributing it in v25.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      # Resolves from the committed pnpm-lock.yaml: no install, no lifecycle
      # scripts. Same command as `task ui:audit`.
      - name: pnpm audit
        run: pnpm audit --audit-level high
