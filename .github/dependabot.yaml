# source: weebo-security template (batlehub@20879e5 .github/dependabot.yaml).
# Daily bumps keep every dependency on its latest release. `cooldown` waits
# seven days before proposing a version. Security updates don't wait.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
  # Base images: kept from the previous config. updatecli on Forgejo also bumps
  # them; drop this entry if the two start opening the same PRs.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
