name: Update version

on:
  schedule:
    - cron: "0 0 * * *" # Run daily at midnight UTC
  workflow_dispatch:
    # Allow manual triggering

permissions:
  contents: write
  pull-requests: write

jobs:
  updatecli:
    runs-on: kubernetes
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Updatecli
        uses: https://github.com/updatecli/updatecli-action@v3.1.3

      - name: 🦀 Install Rust Toolchain
        uses: https://github.com/dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7

      - name: Run Updatecli
        run: updatecli compose apply
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
